<!-- AED texts are Polish only for now, so the area declares its language (WCAG 3.1.2) also in the English portal. -->
<div class="aed" [class.aed--app]="app" lang="pl">
  @if (app) {
    <header class="aed-appbar">
      <span class="aed-brand">
        <img class="aed-brand__logo aed-brand__logo--kolor" src="assets/aed/opiekun-aed-lockup-kolor.svg" alt="Opiekun AED" width="172" height="37" />
        <!-- portal high-contrast modes: negative on black, one colour on yellow (brand book, s. 8) -->
        <img class="aed-brand__logo aed-brand__logo--negatyw" src="assets/aed/opiekun-aed-lockup-negatyw.svg" alt="Opiekun AED" width="172" height="37" />
        <img class="aed-brand__logo aed-brand__logo--mono" src="assets/aed/opiekun-aed-lockup-mono.svg" alt="Opiekun AED" width="172" height="37" />
      </span>
      <span class="aed-tag">prototyp</span>
      <a class="aed-appbar__portal" [routerLink]="['/'] | localize">dane.gov.pl</a>
    </header>
    <main id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  } @else {
    <div class="container aed-page">
      <nav class="aed-nav" aria-label="Opiekun AED">
        <a class="aed-nav__brand" [routerLink]="['/!aed'] | localize">
          <span class="aed-brand">
            <img class="aed-brand__logo aed-brand__logo--kolor" src="assets/aed/opiekun-aed-lockup-kolor.svg" alt="Opiekun AED – start" width="172" height="37" />
            <!-- portal high-contrast modes: negative on black, one colour on yellow (brand book, s. 8) -->
            <img class="aed-brand__logo aed-brand__logo--negatyw" src="assets/aed/opiekun-aed-lockup-negatyw.svg" alt="Opiekun AED – start" width="172" height="37" />
            <img class="aed-brand__logo aed-brand__logo--mono" src="assets/aed/opiekun-aed-lockup-mono.svg" alt="Opiekun AED – start" width="172" height="37" />
          </span>
        </a>
        <ul class="aed-nav__list">
          @for (link of links; track link.label) {
            <li>
              <a
                class="aed-nav__link"
                [routerLink]="link.path | localize"
                routerLinkActive="aed-nav__link--active"
                [routerLinkActiveOptions]="{ exact: link.exact }"
                ariaCurrentWhenActive="page">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
        <!-- Below 480 px a sideways row hides the last sections; a disclosure lists them all. -->
        <details class="aed-nav__menu" #menu>
          <summary>Sekcje AED: {{ current() }}</summary>
          <ul>
            @for (link of links; track link.label) {
              <li>
                <a
                  class="aed-nav__link"
                  [routerLink]="link.path | localize"
                  routerLinkActive="aed-nav__link--active"
                  [routerLinkActiveOptions]="{ exact: link.exact }"
                  ariaCurrentWhenActive="page"
                  (click)="menu.open = false">
                  {{ link.label }}
                </a>
              </li>
            }
          </ul>
        </details>
      </nav>
      <router-outlet />
    </div>
  }
</div>
