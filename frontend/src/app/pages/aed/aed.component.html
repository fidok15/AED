<!-- AED texts are Polish only for now, so the area declares its language (WCAG 3.1.2) also in the English portal. -->
<div class="aed" [class.aed--app]="app" lang="pl">
  @if (app) {
    <header class="aed-appbar">
      <span class="aed-appbar__name">Rejestr AED</span>
      <span class="aed-tag">prototyp</span>
      <a class="aed-appbar__portal" [routerLink]="['/'] | localize">dane.gov.pl</a>
    </header>
    <main id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  } @else {
    <div class="container aed-page">
      <nav class="aed-nav" aria-label="Rejestr AED">
        <ul class="aed-nav__list">
          @for (link of links; track link.label) {
            <li>
              <a
                class="aed-nav__link"
                [routerLink]="link.path | localize"
                routerLinkActive="aed-nav__link--active"
                [routerLinkActiveOptions]="{ exact: link.exact }"
                ariaCurrentWhenActive="page">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
        <!-- Below 480 px a sideways row hides the last sections; a disclosure lists them all. -->
        <details class="aed-nav__menu" #menu>
          <summary>Sekcje AED: {{ current() }}</summary>
          <ul>
            @for (link of links; track link.label) {
              <li>
                <a
                  class="aed-nav__link"
                  [routerLink]="link.path | localize"
                  routerLinkActive="aed-nav__link--active"
                  [routerLinkActiveOptions]="{ exact: link.exact }"
                  ariaCurrentWhenActive="page"
                  (click)="menu.open = false">
                  {{ link.label }}
                </a>
              </li>
            }
          </ul>
        </details>
      </nav>
      <router-outlet />
    </div>
  }
</div>
