# Public deployment with automatic HTTPS (Let's Encrypt via Caddy).
#
#   1. Point the domain's DNS A record at the server; open ports 80 and 443.
#   2. cp .env.example .env   and set AED_DOMAIN
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The prototype is then at https://<AED_DOMAIN>/pl/aed
services:
  aed-service:
    environment:
      # Encoded in QR stickers, activation links and the harvester XML feed.
      AED_BASE_URL: https://${AED_DOMAIN:?set AED_DOMAIN in .env}
      AED_CORS_ORIGINS: https://${AED_DOMAIN}
      AED_DEMO_PASSWORD: ${AED_DEMO_PASSWORD:-}

  caddy:
    image: public.ecr.aws/docker/library/caddy:2
    command: caddy reverse-proxy --from ${AED_DOMAIN} --to web:80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data  # certificates survive restarts (Let's Encrypt rate limits)
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
